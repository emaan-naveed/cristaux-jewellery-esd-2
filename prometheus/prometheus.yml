global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself - useful for checking Prometheus is alive.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Your application.
  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: demo-app

  # Machine metrics: CPU, memory, disk, network.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          # Name the machine being measured - the assignment asks for this.
          machine: local-dev-host
